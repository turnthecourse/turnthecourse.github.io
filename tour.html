<!doctype html>
<html lang="en">
  <head>
    <title>Turn The Course - Tour</title>

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- External styles and fonts -->
    <link rel="stylesheet" href="css/w3.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
      crossorigin="anonymous"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <link
      rel="mask-icon"
      href="favicon/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
  </head>

  <body>
    <div id="navbar-placeholder"></div>

    <!-- Hero banner -->
    <div class="bgimg-2 w3-display-container" id="home">
      <div class="w3-display-middle">
        <img
          src="img/TTC_Logo_white.png"
          class="w3-center w3-padding-large w3-animate-opacity"
          style="width: 100%"
        />
      </div>
    </div>

    <!-- Tour content -->
    <div class="page-bg">
      <div class="w3-content w3-container w3-padding-64">
        <!-- Upcoming shows -->
        <section id="tour-upcoming">
          <h1>UPCOMING SHOWS</h1>
          <div id="bit-upcoming-loading" class="bit-loading">
            <i class="fas fa-circle-notch fa-spin"></i> Loading shows...
          </div>
          <div
            id="bit-upcoming-none"
            class="bit-no-shows"
            style="display: none"
          >
            No upcoming shows at the moment. Check back soon!
          </div>
          <div id="bit-upcoming-error" class="bit-error" style="display: none">
            Could not load shows. Please try again later.
          </div>
          <table
            class="bit-table"
            id="bit-upcoming-table"
            style="display: none"
          >
            <thead>
              <tr>
                <th class="bit-col-date">Date</th>
                <th class="bit-col-venue">Event</th>
                <th class="bit-col-location">City</th>
                <th class="bit-col-actions"></th>
              </tr>
            </thead>
            <tbody id="bit-upcoming-body"></tbody>
          </table>
        </section>

        <!-- Past shows -->
        <section id="tour-past" style="margin-top: 64px">
          <h1>PAST SHOWS</h1>
          <div id="bit-past-loading" class="bit-loading">
            <i class="fas fa-circle-notch fa-spin"></i> Loading shows...
          </div>
          <div id="bit-past-none" class="bit-no-shows" style="display: none">
            No past shows recorded yet.
          </div>
          <div id="bit-past-error" class="bit-error" style="display: none">
            Could not load shows. Please try again later.
          </div>
          <table
            class="bit-table bit-table--past"
            id="bit-past-table"
            style="display: none"
          >
            <thead>
              <tr>
                <th class="bit-col-date">Date</th>
                <th class="bit-col-venue">Event</th>
                <th class="bit-col-location">City</th>
              </tr>
            </thead>
            <tbody id="bit-past-body"></tbody>
          </table>
        </section>
      </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
    <script src="js/tour.js"></script>
  </body>
</html>
